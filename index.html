<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Centre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#e8e8e8;--text:#000;--text2:#666;--accent:#00D632;--accent2:#00b82b;--card:#fff;--border:#e0e0e0;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:16px;--red:#ff3b30;--amber:#ff9500;--green:#00D632}
[data-theme="dark"]{--bg:#000;--bg2:#111;--bg3:#222;--text:#fff;--text2:#999;--card:#111;--border:#222;--shadow:0 2px 12px rgba(0,0,0,.3)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.theme-toggle{width:44px;height:24px;border-radius:12px;background:var(--bg3);border:none;cursor:pointer;position:relative;transition:background .3s}
.theme-toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--text);top:3px;left:3px;transition:transform .3s}
[data-theme="dark"] .theme-toggle::after{transform:translateX(20px)}
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border-radius:12px;padding:4px;overflow-x:auto}
.tab{padding:10px 20px;border:none;background:none;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;border-radius:8px;white-space:nowrap;transition:all .2s}
.tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.section{margin-bottom:48px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg2);color:var(--text)}
.btn-secondary:hover{background:var(--bg3)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg2);border:none;color:var(--text2);cursor:pointer;font-size:16px;transition:all .15s}
.btn-icon:hover{background:var(--bg3);color:var(--text)}
.btn-danger{color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;font-weight:500;appearance:none;cursor:pointer;padding-right:28px;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23999' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
[data-theme="dark"] .card:hover{box-shadow:0 4px 20px rgba(0,0,0,.4)}
.task-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.task-name{font-size:16px;font-weight:600;flex:1}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-red{background:rgba(255,59,48,.12);color:var(--red)}
.badge-amber{background:rgba(255,149,0,.12);color:var(--amber)}
.badge-green{background:rgba(0,214,50,.12);color:var(--green)}
.badge-status{background:var(--bg2);color:var(--text2)}
.badge-cat{background:var(--bg2);color:var(--text2)}
.task-assignee{font-size:12px;color:var(--text2);font-weight:500}
.task-due{font-size:12px;color:var(--text2)}
.task-notes{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.5}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.task-done .task-name{text-decoration:line-through;opacity:.5}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:32px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
.event-card{display:flex;align-items:center;gap:16px}
.event-date-box{text-align:center;min-width:48px}
.event-date-box .month{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase}
.event-date-box .day{font-size:22px;font-weight:700}
.event-info{flex:1}
.event-name{font-size:15px;font-weight:600}
.event-cat{font-size:12px;color:var(--text2)}
.reminder-toggle{position:relative;width:40px;height:22px;cursor:pointer}
.reminder-toggle input{opacity:0;width:0;height:0}
.reminder-toggle .slider{position:absolute;inset:0;background:var(--bg3);border-radius:11px;transition:.3s}
.reminder-toggle .slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.3s}
.reminder-toggle input:checked+.slider{background:var(--accent)}
.reminder-toggle input:checked+.slider::before{transform:translateX(18px)}
.export-bar{display:flex;gap:8px;margin-bottom:24px}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:14px}
@media(max-width:600px){
  .container{padding:16px 12px}
  h1{font-size:22px}
  .form-row{grid-template-columns:1fr}
  .modal{padding:24px 16px}
  .tab{padding:8px 14px;font-size:13px}
  .filters{gap:6px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Command <span>Centre</span></h1>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
  </header>

  <!-- Task Section -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Tasks</div>
      <button class="btn btn-primary" onclick="openTaskModal()">+ Add Task</button>
    </div>
    <div class="tabs" id="assigneeTabs">
      <button class="tab active" data-assignee="all" onclick="setAssignee('all',this)">All</button>
      <button class="tab" data-assignee="Sean" onclick="setAssignee('Sean',this)">Sean's Tasks</button>
      <button class="tab" data-assignee="Xaden" onclick="setAssignee('Xaden',this)">Xaden's Tasks</button>
    </div>
    <div class="filters">
      <select class="filter-select" id="filterStatus" onchange="renderTasks()">
        <option value="">All Statuses</option>
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Done">Done</option>
      </select>
      <select class="filter-select" id="filterPriority" onchange="renderTasks()">
        <option value="">All Priorities</option>
        <option value="High">High</option>
        <option value="Med">Med</option>
        <option value="Low">Low</option>
      </select>
      <select class="filter-select" id="filterCategory" onchange="renderTasks()">
        <option value="">All Categories</option>
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Family">Family</option>
        <option value="Health">Health</option>
      </select>
    </div>
    <div id="taskList"></div>
  </div>

  <!-- Events Section -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Events</div>
      <button class="btn btn-primary" onclick="openEventModal()">+ Add Event</button>
    </div>
    <div id="eventList"></div>
  </div>

  <!-- Export -->
  <div class="export-bar">
    <button class="btn btn-secondary btn-sm" onclick="exportCSV('tasks')">Export Tasks CSV</button>
    <button class="btn btn-secondary btn-sm" onclick="exportCSV('events')">Export Events CSV</button>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2 id="taskModalTitle">Add Task</h2>
    <input type="hidden" id="taskEditId">
    <div class="form-group">
      <label>Task Name</label>
      <input type="text" id="taskName" placeholder="What needs to be done?">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Assigned To</label>
        <select id="taskAssignee"><option>Sean</option><option>Xaden</option></select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="taskStatus"><option>Not Started</option><option>In Progress</option><option>Done</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriority"><option>High</option><option>Med</option><option>Low</option></select>
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="taskDue">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="taskCategory"><option>Work</option><option>Personal</option><option>Family</option><option>Health</option></select>
      </div>
      <div class="form-group">
        <label>Recurring</label>
        <select id="taskRecurring"><option>None</option><option>Daily</option><option>Weekly</option><option>Monthly</option></select>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="taskNotes" placeholder="Optional notes..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('taskModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<!-- Event Modal -->
<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <h2 id="eventModalTitle">Add Event</h2>
    <input type="hidden" id="eventEditId">
    <div class="form-group">
      <label>Event Name</label>
      <input type="text" id="eventName" placeholder="Event name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="eventDate">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="eventCategory"><option>Birthday</option><option>Anniversary</option><option>Meeting</option><option>Deadline</option><option>Other</option></select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('eventModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent()">Save</button>
    </div>
  </div>
</div>

<script>
// State
let tasks = JSON.parse(localStorage.getItem('cc_tasks')||'[]');
let events = JSON.parse(localStorage.getItem('cc_events')||'[]');
let currentAssignee = 'all';

// Theme
function initTheme(){
  const saved = localStorage.getItem('cc_theme');
  const prefer = window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.dataset.theme = saved||prefer;
}
function toggleTheme(){
  const t = document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;
  localStorage.setItem('cc_theme',t);
}
initTheme();

// Tabs
function setAssignee(a,el){
  currentAssignee=a;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// Render Tasks
function renderTasks(){
  const list=document.getElementById('taskList');
  const fs=document.getElementById('filterStatus').value;
  const fp=document.getElementById('filterPriority').value;
  const fc=document.getElementById('filterCategory').value;
  let filtered=tasks.filter(t=>{
    if(currentAssignee!=='all'&&t.assignee!==currentAssignee)return false;
    if(fs&&t.status!==fs)return false;
    if(fp&&t.priority!==fp)return false;
    if(fc&&t.category!==fc)return false;
    return true;
  });
  if(!filtered.length){list.innerHTML='<div class="empty">No tasks yet</div>';return;}
  list.innerHTML=filtered.map(t=>{
    const pc=t.priority==='High'?'red':t.priority==='Med'?'amber':'green';
    const done=t.status==='Done'?'task-done':'';
    const due=t.due?`<span class="task-due">Due ${new Date(t.due+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`:'';
    const rec=t.recurring&&t.recurring!=='None'?`<span class="badge badge-status">🔁 ${t.recurring}</span>`:'';
    const notes=t.notes?`<div class="task-notes">${esc(t.notes)}</div>`:'';
    return`<div class="card ${done}"><div class="task-header"><div><div class="task-name">${esc(t.name)}</div><div class="task-meta"><span class="badge badge-${pc}">${t.priority}</span><span class="badge badge-status">${t.status}</span><span class="badge badge-cat">${t.category}</span>${rec}<span class="task-assignee">${t.assignee}</span>${due}</div>${notes}</div><div class="task-actions"><button class="btn-icon" onclick="editTask('${t.id}')" title="Edit">✏️</button><button class="btn-icon btn-danger" onclick="deleteTask('${t.id}')" title="Delete">🗑</button></div></div></div>`;
  }).join('');
}

// Render Events
function renderEvents(){
  const list=document.getElementById('eventList');
  let sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date));
  if(!sorted.length){list.innerHTML='<div class="empty">No events yet</div>';return;}
  list.innerHTML=sorted.map(e=>{
    const d=new Date(e.date+'T00:00:00');
    const mon=d.toLocaleDateString('en-GB',{month:'short'}).toUpperCase();
    const day=d.getDate();
    return`<div class="card"><div class="event-card"><div class="event-date-box"><div class="month">${mon}</div><div class="day">${day}</div></div><div class="event-info"><div class="event-name">${esc(e.name)}</div><div class="event-cat">${e.category}</div></div><label class="reminder-toggle" title="Reminder"><input type="checkbox" ${e.reminder?'checked':''} onchange="toggleReminder('${e.id}',this.checked)"><span class="slider"></span></label><div class="task-actions"><button class="btn-icon" onclick="editEvent('${e.id}')" title="Edit">✏️</button><button class="btn-icon btn-danger" onclick="deleteEvent('${e.id}')" title="Delete">🗑</button></div></div></div>`;
  }).join('');
}

// Modal
function openTaskModal(id){
  document.getElementById('taskModalTitle').textContent=id?'Edit Task':'Add Task';
  document.getElementById('taskEditId').value=id||'';
  if(id){const t=tasks.find(x=>x.id===id);if(t){document.getElementById('taskName').value=t.name;document.getElementById('taskAssignee').value=t.assignee;document.getElementById('taskStatus').value=t.status;document.getElementById('taskPriority').value=t.priority;document.getElementById('taskDue').value=t.due||'';document.getElementById('taskCategory').value=t.category;document.getElementById('taskRecurring').value=t.recurring||'None';document.getElementById('taskNotes').value=t.notes||'';}}
  else{document.getElementById('taskName').value='';document.getElementById('taskDue').value='';document.getElementById('taskNotes').value='';document.getElementById('taskStatus').value='Not Started';document.getElementById('taskPriority').value='Med';document.getElementById('taskRecurring').value='None';}
  document.getElementById('taskModal').classList.add('open');
}
function openEventModal(id){
  document.getElementById('eventModalTitle').textContent=id?'Edit Event':'Add Event';
  document.getElementById('eventEditId').value=id||'';
  if(id){const e=events.find(x=>x.id===id);if(e){document.getElementById('eventName').value=e.name;document.getElementById('eventDate').value=e.date;document.getElementById('eventCategory').value=e.category;}}
  else{document.getElementById('eventName').value='';document.getElementById('eventDate').value='';document.getElementById('eventCategory').value='Birthday';}
  document.getElementById('eventModal').classList.add('open');
}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// Save
function saveTask(){
  const name=document.getElementById('taskName').value.trim();
  if(!name)return;
  const id=document.getElementById('taskEditId').value||crypto.randomUUID();
  const task={id,name,assignee:document.getElementById('taskAssignee').value,status:document.getElementById('taskStatus').value,priority:document.getElementById('taskPriority').value,due:document.getElementById('taskDue').value,category:document.getElementById('taskCategory').value,recurring:document.getElementById('taskRecurring').value,notes:document.getElementById('taskNotes').value.trim()};
  const idx=tasks.findIndex(t=>t.id===id);
  if(idx>=0)tasks[idx]=task;else tasks.push(task);
  persist();closeModal('taskModal');renderTasks();
}
function saveEvent(){
  const name=document.getElementById('eventName').value.trim();
  const date=document.getElementById('eventDate').value;
  if(!name||!date)return;
  const id=document.getElementById('eventEditId').value||crypto.randomUUID();
  const ev={id,name,date,category:document.getElementById('eventCategory').value,reminder:events.find(x=>x.id===id)?.reminder||false};
  const idx=events.findIndex(e=>e.id===id);
  if(idx>=0)events[idx]=ev;else events.push(ev);
  persist();closeModal('eventModal');renderEvents();
}

// Actions
function editTask(id){openTaskModal(id);}
function deleteTask(id){if(confirm('Delete this task?')){tasks=tasks.filter(t=>t.id!==id);persist();renderTasks();}}
function editEvent(id){openEventModal(id);}
function deleteEvent(id){if(confirm('Delete this event?')){events=events.filter(e=>e.id!==id);persist();renderEvents();}}
function toggleReminder(id,val){const e=events.find(x=>x.id===id);if(e){e.reminder=val;persist();}}

// Persist
function persist(){localStorage.setItem('cc_tasks',JSON.stringify(tasks));localStorage.setItem('cc_events',JSON.stringify(events));}

// Export
function exportCSV(type){
  let csv,fn;
  if(type==='tasks'){
    csv='Name,Assignee,Status,Priority,Due,Category,Recurring,Notes\n'+tasks.map(t=>[t.name,t.assignee,t.status,t.priority,t.due,t.category,t.recurring,t.notes].map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
    fn='tasks.csv';
  }else{
    csv='Name,Date,Category,Reminder\n'+events.map(e=>[e.name,e.date,e.category,e.reminder?'Yes':'No'].map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
    fn='events.csv';
  }
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=fn;a.click();
}

// Escape HTML
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

// Init
renderTasks();renderEvents();
</script>
</body>
</html>
