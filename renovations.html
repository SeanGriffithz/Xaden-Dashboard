<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Renovations — Command Centre</title>
<script>(function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark')}else{document.documentElement.classList.add('dark')}})();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#e8e8e8;--text:#000;--text2:#666;--text3:#999;--border:#e0e0e0;--card:#fff;--shadow:0 1px 3px rgba(0,0,0,.08);--accent:#00D632;--red:#ff3b30;--amber:#ff9500;--blue:#0a84ff;--purple:#af52de;--radius:16px}
.dark{--bg:#050505;--bg2:#161616;--bg3:#252525;--text:#e8e8e8;--text2:#888;--text3:#555;--border:#2a2a2a;--card:#1c1c1e;--shadow:0 1px 3px rgba(255,255,255,.03)}
html,body{background:var(--bg);min-height:100vh}
.dark body{background:linear-gradient(180deg,#111 0%,#0a0a0a 30%,#050505 100%)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.container{max-width:800px;margin:0 auto;padding:16px}
header{padding:20px 0 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:24px;font-weight:700;letter-spacing:-.5px}

/* Nav */
.page-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto}
.dark .page-tabs{background:rgba(255,255,255,.06)}
.page-tab{flex:1;min-width:fit-content;padding:9px 8px;border:none;background:none;border-radius:10px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.page-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;text-align:center}
.sum-card .label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:4px}
.sum-card .val{font-size:18px;font-weight:700;letter-spacing:-.3px}
.sum-card.total .val{color:var(--amber)}
.sum-card.done .val{color:var(--accent)}
.sum-card.progress .val{color:var(--blue)}
.sum-card.jobs .val{color:var(--text)}

/* Filters */
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filter-pill{padding:7px 14px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--text2);background:var(--card);cursor:pointer;transition:all .2s}
.filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Job Cards */
.job-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:all .2s}
.job-header{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer}
.job-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.job-main{flex:1;min-width:0}
.job-title{font-size:15px;font-weight:700}
.job-sub{font-size:12px;color:var(--text3);margin-top:2px}
.job-right{text-align:right;flex-shrink:0}
.job-cost{font-size:16px;font-weight:700;color:var(--amber)}
.badges{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}

/* Status badges */
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
.badge-not-started{background:rgba(142,142,147,.15);color:#8e8e93}
.badge-in-progress{background:rgba(255,149,0,.15);color:#ff9500}
.badge-complete{background:rgba(0,214,50,.15);color:#00D632}
.badge-on-hold{background:rgba(99,99,102,.15);color:#636366}
.badge-high{background:rgba(255,69,58,.15);color:#ff453a}
.badge-medium{background:rgba(255,159,10,.15);color:#ff9f0a}
.badge-low{background:rgba(50,215,75,.15);color:#32d74b}

/* Cat icons */
.ci-carpenter{background:rgba(255,159,10,.15)}
.ci-plumber{background:rgba(10,132,255,.15)}
.ci-electrician{background:rgba(255,214,10,.15)}
.ci-landscaping{background:rgba(50,215,75,.15)}
.ci-builder{background:rgba(255,69,58,.15)}
.ci-decorator{background:rgba(175,82,222,.15)}
.ci-groundwork{background:rgba(142,142,147,.15)}
.ci-tiler{background:rgba(10,132,255,.15)}
.ci-other{background:rgba(99,99,102,.15)}

/* Detail panel */
.job-detail{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.job-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.detail-item .dl{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text3);letter-spacing:.4px;margin-bottom:3px}
.detail-item .dv{font-size:13px;font-weight:600;color:var(--text)}
.detail-item .dv.green{color:var(--accent)}
.detail-item .dv.amber{color:var(--amber)}
.costs-row{display:flex;gap:8px;margin-top:10px}
.cost-box{flex:1;background:var(--bg2);border-radius:10px;padding:10px;text-align:center}
.cost-box .cl{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.cost-box .cv{font-size:15px;font-weight:700}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
</style>
</head>
<body>
<div class="container">
  <header><h1>🏠 Renovations</h1></header>

  <div class="page-tabs">
    <a class="page-tab" href="index.html">Tasks</a>
    <a class="page-tab" href="documents.html">Docs</a>
    <a class="page-tab" href="agents.html">Agents</a>
    <a class="page-tab" href="history.html">History</a>
    <a class="page-tab" href="finance.html">Finance</a>
    <a class="page-tab active" href="renovations.html">Renos</a>
  </div>

  <div class="summary-grid">
    <div class="sum-card jobs"><div class="label">Total Jobs</div><div class="val" id="totalJobs">0</div></div>
    <div class="sum-card progress"><div class="label">In Progress</div><div class="val" id="inProgress">0</div></div>
    <div class="sum-card done"><div class="label">Complete</div><div class="val" id="complete">0</div></div>
    <div class="sum-card total"><div class="label">Total Cost</div><div class="val" id="totalCost">£0</div></div>
  </div>

  <div class="filters">
    <button class="filter-pill active" onclick="filter('all',this)">All</button>
    <button class="filter-pill" onclick="filter('Not Started',this)">Not Started</button>
    <button class="filter-pill" onclick="filter('In Progress',this)">In Progress</button>
    <button class="filter-pill" onclick="filter('Complete',this)">Complete</button>
    <button class="filter-pill" onclick="filter('On Hold',this)">On Hold</button>
  </div>

  <div id="jobList"></div>
</div>

<script>
const JOBS = [
  {task:"Downstairs Door",cat:"Carpenter",contractor:"A1 Carpentry",name:"",phone:"",email:"",quoteDate:"",startDate:"",endDate:"",labour:90,materials:140,status:"Not Started",priority:"Medium",notes:""},
];

const CAT_ICONS = {
  Carpenter:"🪵",Plumber:"🔧",Electrician:"⚡",Landscaping:"🌿",
  Builder:"🧱",Decorator:"🎨",Groundwork:"⛏",Tiler:"🪟",Other:"🔨"
};
const CAT_CI = {
  Carpenter:"ci-carpenter",Plumber:"ci-plumber",Electrician:"ci-electrician",
  Landscaping:"ci-landscaping",Builder:"ci-builder",Decorator:"ci-decorator",
  Groundwork:"ci-groundwork",Tiler:"ci-tiler",Other:"ci-other"
};

function fmtAmt(n){return n?'£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:0}):'—'}
function statusBadge(s){
  const map={'Not Started':'badge-not-started','In Progress':'badge-in-progress','Complete':'badge-complete','On Hold':'badge-on-hold'};
  return `<span class="badge ${map[s]||'badge-not-started'}">${s}</span>`;
}
function priorityBadge(p){
  const map={'High':'badge-high','Medium':'badge-medium','Low':'badge-low'};
  return `<span class="badge ${map[p]||'badge-medium'}">${p}</span>`;
}

let activeFilter = 'all';
function filter(val, el){
  activeFilter = val;
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  const list = document.getElementById('jobList');
  const filtered = activeFilter==='all' ? JOBS : JOBS.filter(j=>j.status===activeFilter);

  // Summary
  document.getElementById('totalJobs').textContent = JOBS.length;
  document.getElementById('inProgress').textContent = JOBS.filter(j=>j.status==='In Progress').length;
  document.getElementById('complete').textContent = JOBS.filter(j=>j.status==='Complete').length;
  const grand = JOBS.reduce((s,j)=>s+(j.labour||0)+(j.materials||0),0);
  document.getElementById('totalCost').textContent = fmtAmt(grand);

  if(!filtered.length){list.innerHTML='<div class="empty">No jobs found</div>';return;}

  list.innerHTML = filtered.map((j,i)=>{
    const total = (j.labour||0)+(j.materials||0);
    const icon = CAT_ICONS[j.cat]||'🔨';
    const ci = CAT_CI[j.cat]||'ci-other';
    return `<div class="job-card" id="card${i}">
      <div class="job-header" onclick="toggle(${i})">
        <div class="job-icon ${ci}">${icon}</div>
        <div class="job-main">
          <div class="job-title">${j.task}</div>
          <div class="job-sub">${j.cat}${j.contractor?' · '+j.contractor:''}</div>
        </div>
        <div class="job-right">
          <div class="job-cost">${total?fmtAmt(total):'TBC'}</div>
          <div class="badges">${statusBadge(j.status)}${priorityBadge(j.priority)}</div>
        </div>
      </div>
      <div class="job-detail" id="detail${i}">
        <div class="costs-row">
          <div class="cost-box"><div class="cl">Labour</div><div class="cv" style="color:var(--blue)">${fmtAmt(j.labour)}</div></div>
          <div class="cost-box"><div class="cl">Materials</div><div class="cv" style="color:var(--purple)">${fmtAmt(j.materials)}</div></div>
          <div class="cost-box"><div class="cl">Total</div><div class="cv" style="color:var(--amber)">${fmtAmt(total)||'TBC'}</div></div>
        </div>
        <div class="detail-grid">
          ${j.name?`<div class="detail-item"><div class="dl">Contact</div><div class="dv">${j.name}</div></div>`:''}
          ${j.phone?`<div class="detail-item"><div class="dl">Phone</div><div class="dv">${j.phone}</div></div>`:''}
          ${j.email?`<div class="detail-item"><div class="dl">Email</div><div class="dv">${j.email}</div></div>`:''}
          ${j.quoteDate?`<div class="detail-item"><div class="dl">Quote Date</div><div class="dv">${j.quoteDate}</div></div>`:''}
          ${j.startDate?`<div class="detail-item"><div class="dl">Start Date</div><div class="dv">${j.startDate}</div></div>`:''}
          ${j.endDate?`<div class="detail-item"><div class="dl">Completion</div><div class="dv green">${j.endDate}</div></div>`:''}
          ${j.notes?`<div class="detail-item" style="grid-column:1/-1"><div class="dl">Notes</div><div class="dv">${j.notes}</div></div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i){
  const d = document.getElementById(`detail${i}`);
  d.classList.toggle('open');
}

render();
</script>
</body>
</html>
