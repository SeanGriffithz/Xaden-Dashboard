<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finance — Command Centre</title>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark')}else if(t==='dark'||!t){document.documentElement.classList.add('dark')}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.classList.remove('dark')}})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#e8e8e8;--text:#000;--text2:#666;--text3:#999;--border:#e0e0e0;--card:#fff;--shadow:0 1px 3px rgba(0,0,0,.08);--accent:#00D632;--red:#ff3b30;--amber:#ff9500;--blue:#0a84ff;--radius:16px}
.dark{--bg:#050505;--bg2:#161616;--bg3:#252525;--text:#e8e8e8;--text2:#888;--text3:#555;--border:#2a2a2a;--card:#1c1c1e;--shadow:0 1px 3px rgba(255,255,255,.03)}
html{background:var(--bg);min-height:100%;height:100%}
html.dark{background:#050505}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.dark body{background:linear-gradient(180deg,#111 0%,#0a0a0a 30%,#050505 100%)}
.container{max-width:800px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 12px;gap:12px}
header h1{font-size:24px;font-weight:700;letter-spacing:-.5px}

/* Nav */
.page-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:16px}
.dark .page-tabs{background:rgba(255,255,255,.06)}
.page-tab{flex:1;padding:10px 8px;border:none;background:none;border-radius:10px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.page-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Hero Card */
.hero-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.hero-left .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px}
.hero-left .amount{font-size:36px;font-weight:800;letter-spacing:-1px;color:var(--accent)}
.hero-left .subtext{font-size:12px;color:var(--text3);margin-top:3px}
.hero-right{text-align:right}
.hero-right .bar-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.budget-bar-bg{width:120px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.budget-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#00b82b);transition:width .6s}
.budget-bar-fill.warn{background:linear-gradient(90deg,var(--amber),#e67e00)}
.budget-bar-fill.danger{background:linear-gradient(90deg,var(--red),#cc2200)}
.hero-right .pct{font-size:13px;font-weight:700;color:var(--text2);margin-top:5px;text-align:right}

/* Mini Cards Row */
.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mini-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.mini-card .label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:4px}
.mini-card .amount{font-size:17px;font-weight:700;letter-spacing:-.3px}
.mini-card.income .amount{color:var(--blue)}
.mini-card.outgoing .amount{color:var(--red)}
.mini-card.annual .amount{color:var(--amber);font-size:14px}

/* Next Up */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px}
.next-up{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.next-up::-webkit-scrollbar{display:none}
.next-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;flex-shrink:0;min-width:120px}
.next-card .nc-days{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);margin-bottom:4px}
.next-card .nc-days.soon{color:var(--amber)}
.next-card .nc-days.today{color:var(--red)}
.next-card .nc-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.next-card .nc-amt{font-size:15px;font-weight:700;color:var(--red)}
.next-card .nc-date{font-size:10px;color:var(--text3);margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:14px}
.dark .tabs{background:rgba(255,255,255,.06)}
.tab{flex:1;padding:9px 8px;border:none;background:none;border-radius:10px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;text-align:center}
.tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Category Group */
.cat-group{margin-bottom:12px}
.cat-group-header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;margin-bottom:4px}
.cat-group-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)}
.cat-group-total{font-size:12px;font-weight:700;color:var(--text2)}

/* Bill Row */
.bill-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:4px}
.bill-row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid var(--border)}
.bill-row:last-child{border-bottom:none}
.bill-date{width:32px;height:32px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0;text-align:center;line-height:1.2}
.bill-info{flex:1;min-width:0}
.bill-name{font-size:14px;font-weight:600}
.bill-amount{font-size:15px;font-weight:700;color:var(--red);flex-shrink:0}

/* Annual badge */
.annual-badge{background:rgba(255,149,0,.12);color:#ff9500;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px}

/* Cat icon colours */
.ci{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ci-house{background:rgba(10,132,255,.12)}
.ci-car{background:rgba(255,159,10,.12)}
.ci-sub{background:rgba(175,82,222,.12)}
.ci-insurance{background:rgba(255,69,58,.12)}
.ci-utilities{background:rgba(255,214,10,.12)}
.ci-internet{background:rgba(10,132,255,.12)}
.ci-phone{background:rgba(52,199,89,.12)}
.ci-charity{background:rgba(255,149,0,.12)}
.ci-finance{background:rgba(255,69,58,.12)}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Finance</h1>
  </header>

  <!-- Nav -->
  <div class="page-tabs">
    <a class="page-tab" href="index.html">Tasks</a>
    <a class="page-tab" href="documents.html">Docs</a>
    <a class="page-tab" href="agents.html">Agents</a>
    <a class="page-tab" href="history.html">History</a>
    <a class="page-tab active" href="finance.html">Finance</a>
  </div>

  <!-- Hero -->
  <div class="hero-card">
    <div class="hero-left">
      <div class="label">Left Over</div>
      <div class="amount" id="heroLeft"></div>
      <div class="subtext" id="heroSub"></div>
    </div>
    <div class="hero-right">
      <div class="bar-label">of income committed</div>
      <div class="budget-bar-bg"><div class="budget-bar-fill" id="budgetBar" style="width:0%"></div></div>
      <div class="pct" id="budgetPct"></div>
    </div>
  </div>

  <!-- Mini Cards -->
  <div class="mini-cards">
    <div class="mini-card income">
      <div class="label">Income</div>
      <div class="amount" id="incomeAmt"></div>
    </div>
    <div class="mini-card outgoing">
      <div class="label">Monthly</div>
      <div class="amount" id="monthlyAmt"></div>
    </div>
    <div class="mini-card annual">
      <div class="label">Annual equiv</div>
      <div class="amount" id="annualEquiv"></div>
    </div>
  </div>

  <!-- Next Up -->
  <div class="section-title">Next Up</div>
  <div class="next-up" id="nextUp"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('monthly',this)">Monthly Bills</button>
    <button class="tab" onclick="switchTab('annual',this)">Annual Bills</button>
  </div>

  <div id="view-monthly"></div>
  <div id="view-annual" style="display:none"></div>
</div>

<script>
const INCOME = 3200;

const MONTHLY = [
  {day:6,  name:'Mortgage',                cat:'Housing',     icon:'🏠', ci:'ci-house',     amt:700},
  {day:15, name:'Council Tax',             cat:'Housing',     icon:'🏠', ci:'ci-house',     amt:225},
  {day:6,  name:'Tesla',                   cat:'Car',         icon:'🚗', ci:'ci-car',       amt:480},
  {day:12, name:'Tesla Premium',           cat:'Car',         icon:'🚗', ci:'ci-car',       amt:10},
  {day:11, name:'Car Insurance',           cat:'Car',         icon:'🚗', ci:'ci-car',       amt:100},
  {day:6,  name:'Gas & Electric',          cat:'Utilities',   icon:'⚡', ci:'ci-utilities', amt:200},
  {day:15, name:'Virgin Media',            cat:'Internet',    icon:'📡', ci:'ci-internet',  amt:40},
  {day:6,  name:'House Insurance',         cat:'Insurance',   icon:'🛡', ci:'ci-insurance', amt:55},
  {day:6,  name:'Life & Critical Illness', cat:'Insurance',   icon:'🛡', ci:'ci-insurance', amt:55},
  {day:18, name:'AppleCare+',             cat:'Phone',       icon:'📱', ci:'ci-phone',     amt:20},
  {day:23, name:'EE',                      cat:'Phone',       icon:'📱', ci:'ci-phone',     amt:35},
  {day:6,  name:'Spotify',                 cat:'Subscriptions',icon:'🎵',ci:'ci-sub',       amt:15},
  {day:6,  name:'Netflix',                 cat:'Subscriptions',icon:'🎬',ci:'ci-sub',       amt:15},
  {day:7,  name:'iCloud',                  cat:'Subscriptions',icon:'☁️',ci:'ci-sub',       amt:10},
  {day:8,  name:'TV Licence',              cat:'Subscriptions',icon:'📺',ci:'ci-sub',       amt:15},
  {day:24, name:'Website',                 cat:'Subscriptions',icon:'🌐',ci:'ci-sub',       amt:20},
  {day:11, name:'The Grand Charity',       cat:'Charity',     icon:'🤝', ci:'ci-charity',   amt:15},
];

const ANNUAL = [
  {month:1,  day:1,  name:'Gnoll Lodge',        cat:'Charity',      icon:'🤝', ci:'ci-charity',  amt:180},
  {month:3,  day:1,  name:'Platinum Amex Card', cat:'Finance',      icon:'💳', ci:'ci-finance',  amt:650},
  {month:6,  day:1,  name:'Proton',             cat:'Subscriptions',icon:'🔒', ci:'ci-sub',      amt:120},
  {month:6,  day:21, name:'Apple Developer',    cat:'Subscriptions',icon:'🍎', ci:'ci-sub',      amt:80},
  {month:7,  day:6,  name:'Google One',         cat:'Subscriptions',icon:'☁️', ci:'ci-sub',      amt:90},
  {month:9,  day:1,  name:'Vehicle Tax',        cat:'Car',          icon:'🚗', ci:'ci-car',      amt:195},
  {month:10, day:6,  name:'BA Amex Card',       cat:'Finance',      icon:'💳', ci:'ci-finance',  amt:350},
];

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtAmt(n){return '£'+n.toLocaleString('en-GB',{minimumFractionDigits:0})}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

// Calculations
const monthlyTotal = MONTHLY.reduce((s,b)=>s+b.amt,0);
const annualTotal  = ANNUAL.reduce((s,b)=>s+b.amt,0);
const annualEquiv  = annualTotal/12;
const totalOut     = monthlyTotal + annualEquiv;
const leftOver     = INCOME - totalOut;
const pct          = Math.round((totalOut/INCOME)*100);

// Hero
document.getElementById('heroLeft').textContent  = fmtAmt(Math.round(leftOver));
document.getElementById('heroSub').textContent   = Math.round((leftOver/INCOME)*100)+'% of income';
document.getElementById('incomeAmt').textContent = fmtAmt(INCOME);
document.getElementById('monthlyAmt').textContent= fmtAmt(monthlyTotal);
document.getElementById('annualEquiv').textContent= '£'+annualEquiv.toFixed(2).replace(/\.00$/,'');
document.getElementById('budgetPct').textContent = pct+'%';
var bar = document.getElementById('budgetBar');
bar.style.width = Math.min(pct,100)+'%';
if(pct>85) bar.classList.add('danger');
else if(pct>70) bar.classList.add('warn');

// Next Up — find next 4 upcoming bills this/next month
function getNextBills(){
  var now = new Date();
  var today = now.getDate();
  var thisMonth = now.getMonth()+1;
  var upcoming = [];
  MONTHLY.forEach(function(b){
    var daysUntil = b.day - today;
    if(daysUntil < 0) daysUntil += 31; // rough next month calc
    upcoming.push({name:b.name, amt:b.amt, day:b.day, daysUntil:daysUntil, icon:b.icon, thisMonth: b.day >= today});
  });
  // Also check annual bills this month or next
  ANNUAL.forEach(function(b){
    if(b.month === thisMonth && b.day >= today){
      var daysUntil = b.day - today;
      upcoming.push({name:b.name, amt:b.amt, day:b.day, daysUntil:daysUntil, icon:b.icon, thisMonth:true, annual:true});
    }
  });
  upcoming.sort(function(a,b){return a.daysUntil-b.daysUntil});
  return upcoming.slice(0,4);
}

var nextBills = getNextBills();
var nextHtml = '';
nextBills.forEach(function(b){
  var label, cls;
  if(b.daysUntil === 0){label='Today'; cls='today';}
  else if(b.daysUntil <= 3){label='In '+b.daysUntil+' days'; cls='soon';}
  else{label='In '+b.daysUntil+' days'; cls='';}
  nextHtml += '<div class="next-card">'+
    '<div class="nc-days '+cls+'">'+label+'</div>'+
    '<div class="nc-name">'+b.icon+' '+b.name+'</div>'+
    '<div class="nc-amt">'+fmtAmt(b.amt)+'</div>'+
    '<div class="nc-date">'+ordinal(b.day)+' of month</div>'+
  '</div>';
});
document.getElementById('nextUp').innerHTML = nextHtml;

// Group bills by category
function groupBy(arr, key){
  var groups = {};
  var order = [];
  arr.forEach(function(b){
    if(!groups[b[key]]){groups[b[key]]=[];order.push(b[key]);}
    groups[b[key]].push(b);
  });
  return {groups:groups, order:order};
}

// Monthly View — grouped by category
function renderMonthly(){
  var g = groupBy(MONTHLY.slice().sort((a,b)=>a.day-b.day), 'cat');
  var html = '';
  g.order.forEach(function(cat){
    var bills = g.groups[cat];
    var catTotal = bills.reduce(function(s,b){return s+b.amt},0);
    html += '<div class="cat-group">'+
      '<div class="cat-group-header">'+
        '<span class="cat-group-name">'+cat+'</span>'+
        '<span class="cat-group-total">'+fmtAmt(catTotal)+'/mo</span>'+
      '</div>'+
      '<div class="bill-card">';
    bills.forEach(function(b){
      html += '<div class="bill-row">'+
        '<div class="ci '+b.ci+'">'+b.icon+'</div>'+
        '<div class="bill-info"><div class="bill-name">'+b.name+'</div></div>'+
        '<div style="text-align:right">'+
          '<div class="bill-amount">'+fmtAmt(b.amt)+'</div>'+
          '<div style="font-size:10px;color:var(--text3);margin-top:2px">'+ordinal(b.day)+'</div>'+
        '</div>'+
      '</div>';
    });
    html += '</div></div>';
  });
  document.getElementById('view-monthly').innerHTML = html;
}

// Annual View
function renderAnnual(){
  var sorted = ANNUAL.slice().sort(function(a,b){return a.month!==b.month?a.month-b.month:a.day-b.day});
  var html = '<div class="cat-group-header"><span class="cat-group-name">Annual Bills</span><span class="cat-group-total">£'+annualTotal.toLocaleString('en-GB')+'/yr · '+fmtAmt(Math.round(annualEquiv))+'/mo equiv</span></div>';
  html += '<div class="bill-card">';
  sorted.forEach(function(b){
    html += '<div class="bill-row">'+
      '<div class="ci '+b.ci+'">'+b.icon+'</div>'+
      '<div class="bill-info"><div class="bill-name">'+b.name+'<span class="annual-badge">Annual</span></div></div>'+
      '<div style="text-align:right">'+
        '<div class="bill-amount">'+fmtAmt(b.amt)+'</div>'+
        '<div style="font-size:10px;color:var(--text3);margin-top:2px">'+ordinal(b.day)+' '+MONTHS_SHORT[b.month-1]+'</div>'+
      '</div>'+
    '</div>';
  });
  html += '</div>';
  document.getElementById('view-annual').innerHTML = html;
}

function switchTab(name, el){
  document.querySelectorAll('.tabs .tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  ['monthly','annual'].forEach(function(v){
    document.getElementById('view-'+v).style.display = v===name?'block':'none';
  });
}

renderMonthly();
renderAnnual();
</script>
</body>
</html>
